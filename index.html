<title>炸雞排，你幾分？</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：整個遊戲是一張 16:9 的夜市攤位畫面，盡量撐滿視窗；開店、暫停、打烊結算用浮在上面的紙卡。刻意只用一種外觀（夜晚的夜市攤）。 */
:root {
  --night: #1b1820;
  --ink: #2b2521;
  --ink-soft: #5c534c;
  --sign: #c4281c;
  --sign-ink: #ffd84a;
  --paper: #fffdf5;
  --pen: #1f3e7a;
  --f-sign: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-hand: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
body {
  background: var(--night);
  background-image: radial-gradient(ellipse at 50% 0%, #3a2a2a 0%, transparent 60%);
  color: var(--ink); font-family: var(--f-sign); font-size: 16px; min-height: 100vh;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.game { position: relative; width: min(100%, calc((100vh - 24px) * 16 / 9)); margin: 0 auto; }
#cv { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; touch-action: none; background: #2a2622; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.corner { position: absolute; top: 1.2%; right: 1%; display: flex; gap: 8px; }
.iconbtn {
  background: rgba(43,37,33,.55); border: 2px solid var(--sign-ink); color: var(--sign-ink); border-radius: 999px;
  font: 700 13px var(--f-sign); padding: 4px 12px; cursor: pointer;
}
button:focus-visible { outline: 3px solid #6aa8ff; outline-offset: 2px; }

/* 浮動訊息 */
.toasts { position: absolute; left: 50%; transform: translateX(-50%); top: 31%; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; width: min(60%, 640px); }
.toast { background: rgba(30,26,24,.92); color: #fff; padding: 8px 14px; border-radius: 10px; font: 500 15px/1.45 var(--f-sign); text-align: center; animation: toast 4.4s forwards; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.toast b { color: var(--sign-ink); }
.toast.bad b { color: #ff8a7a; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 6%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* 開店／暫停／打烊紙卡 */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(20,16,14,.62); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card {
  background: var(--paper); border-radius: 4px; padding: 20px 24px; width: min(100%, 780px); max-height: 100%; overflow: auto;
  box-shadow: 0 16px 40px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 10px; color: var(--ink); color-scheme: light;
}
.card h2 { margin: 0; font: 900 26px var(--f-sign); color: var(--sign); text-wrap: balance; }
.card h3 { margin: 4px 0 0; font: 900 18px var(--f-sign); color: var(--sign); }
.card p { margin: 0; line-height: 1.6; }
.card .hand { font: 700 19px/1.5 var(--f-hand); color: var(--pen); }
.card .newitem { margin: 0; padding: 8px 12px; border-radius: 8px; background: #fff3c4; border: 2px dashed #d9a400; font-size: 15px; }
.how { margin: 0; padding-left: 1.4em; display: grid; gap: 3px; line-height: 1.55; font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stats div { background: #f3eee2; border-radius: 6px; padding: 8px 10px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.stats b { display: block; font: 900 22px var(--f-sign); color: var(--ink); font-variant-numeric: tabular-nums; }
.stars { font: 900 34px var(--f-sign); color: #e0a400; letter-spacing: 4px; line-height: 1; }
.stars .off { color: #d8d0c0; }
.shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.up { border: 1.5px solid #e3d9c6; border-radius: 6px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.up b { font-size: 15px; }
.up small { grid-column: 1; color: var(--ink-soft); font-size: 12px; line-height: 1.4; }
.up button { grid-row: 1 / span 2; grid-column: 2; }
.up.own { background: #eef6ee; border-color: #bcd9bf; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button.btn {
  font: 700 15px var(--f-sign); padding: 9px 14px; border-radius: 8px; cursor: pointer;
  border: 2px solid var(--ink); background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--ink);
}
button.btn:active { transform: translateY(3px); box-shadow: none; }
button.btn.go { background: var(--sign); color: #fff; border-color: #7d170f; box-shadow: 0 3px 0 #7d170f; }
button.btn:disabled { opacity: .35; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font: 500 13px var(--f-sign); padding: 4px; }
@media (max-width: 760px) { .stats, .shop { grid-template-columns: repeat(2, minmax(0, 1fr)); } .toast { font-size: 13px; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>

<div class="game">
  <canvas id="cv" width="1600" height="900" aria-label="夜市雞排攤"></canvas>
  <div class="corner">
    <button class="iconbtn" id="pause" type="button">暫停 P</button>
    <button class="iconbtn" id="mute" type="button" aria-pressed="false">聲音 開</button>
  </div>
  <div class="toasts" id="toasts"></div>
</div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script>
(() => {
  // ================= 基本設定 =================
  const W = 1600, H = 900, LX = 200, LY = 205, BASE_R = 70;   // 每塊雞排畫在自己的 400×400 小畫布上，中心 (200, 205)
  const NIGHT = 150;                                          // 一晚營業 150 秒（17:00–23:00）
  const SANS = '"Noto Sans TC", "PingFang TC", sans-serif', HAND = '"LXGW WenKai TC", "Kaiti TC", serif';
  const $ = id => document.getElementById(id);
  const cv = $('cv');
  const DPR = Math.min(2.2, (window.devicePixelRatio || 1) * Math.max(0.6, cv.getBoundingClientRect().width / W));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const ctx = cv.getContext('2d');
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const RS = Math.max(0.6, DPR * 0.85);                       // 雞排小畫布的解析度
  const mk = (w, h = w) => { const c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h); return c; };
  const hit = mk(400).getContext('2d');
  const tint = mk(400 * RS), tctx = tint.getContext('2d');

  const rand = Math.random;
  const pick = a => a[(rand() * a.length) | 0];
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  function stopColor(stops, t, shift = 0, alpha = 1) {
    let i = 0;
    while (i < stops.length - 2 && t > stops[i + 1][0]) i++;
    const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
    const k = clamp((t - t0) / (t1 - t0)), a = hex(c0), b = hex(c1);
    return `rgba(${a.map((v, j) => clamp(Math.round(v + (b[j] - v) * k + shift), 0, 255)).join(',')},${alpha})`;
  }
  const CRUST = [[0, '#f4eee0'], [0.5, '#efd796'], [0.8, '#e4ae4e'], [1.0, '#d18c2e'], [1.2, '#b86c1f'], [1.5, '#7c3f14'], [1.9, '#2b1a10']];
  const MEAT = [[0, '#eba696'], [0.6, '#dcb79a'], [1.0, '#c9a07a'], [1.5, '#7a4a24'], [1.9, '#2b1a10']];

  // ================= 酥皮紋理（地瓜粉一顆顆、麵包粉一片片）=================
  const TEX = {};
  for (const kind of ['地瓜粉', '麵包粉']) {
    const c = mk(400 * RS), x = c.getContext('2d');
    x.setTransform(RS, 0, 0, RS, 0, 0);
    x.fillStyle = '#808080'; x.fillRect(0, 0, 400, 400);
    if (kind === '地瓜粉') {
      for (let i = 0; i < 2600; i++) {
        const px = rand() * 400, py = rand() * 400, r = 1 + Math.pow(rand(), 2) * 4.2;
        x.fillStyle = 'rgba(40,40,40,0.45)'; x.beginPath(); x.arc(px + r * 0.35, py + r * 0.4, r, 0, 6.29); x.fill();
        x.fillStyle = 'rgba(178,178,178,0.55)'; x.beginPath(); x.arc(px - r * 0.15, py - r * 0.2, r * 0.82, 0, 6.29); x.fill();
        if (r > 2.5) { x.fillStyle = 'rgba(225,225,225,0.35)'; x.beginPath(); x.arc(px - r * 0.4, py - r * 0.45, r * 0.3, 0, 6.29); x.fill(); }
      }
    } else {
      for (let i = 0; i < 3200; i++) {
        const px = rand() * 400, py = rand() * 400, w = 2 + rand() * 5, h = 1 + rand() * 1.8;
        x.save(); x.translate(px, py); x.rotate(rand() * 3.14);
        x.fillStyle = 'rgba(40,40,40,0.4)'; x.fillRect(-w / 2 + 0.8, -h / 2 + 0.9, w, h);
        x.fillStyle = 'rgba(190,190,190,0.6)'; x.fillRect(-w / 2, -h / 2, w, h);
        x.restore();
      }
    }
    for (let i = 0; i < 4500; i++) { x.fillStyle = rand() < 0.5 ? 'rgba(255,255,255,0.32)' : 'rgba(0,0,0,0.28)'; x.fillRect(rand() * 400, rand() * 400, 1, 1); }
    TEX[kind] = c;
  }

  // ================= 存檔與升級 =================
  const UPGRADES = [
    { id: 'wok3', name: '大油鍋', desc: '油鍋從 2 格變 3 格，可以同時炸三塊。', price: 600 },
    { id: 'mallet', name: '老師傅肉槌', desc: '拍肉時擺動變慢，比較好抓時機。', price: 300 },
    { id: 'bowl', name: '大粉盆', desc: '裹粉的範圍變大，抹兩下就裹滿。', price: 250 },
    { id: 'lamp', name: '炸色提示燈', desc: '鍋裡的雞排旁邊會標出現在的炸色。', price: 400 },
    { id: 'bench', name: '排隊板凳', desc: '客人坐著等，耐心多 25%。', price: 450 },
    { id: 'neon', name: '霓虹招牌', desc: '客人來得更勤，小費多 30%。', price: 700 }
  ];
  const fresh = () => ({ day: 1, wallet: 0, best: 0, ups: {}, seenHow: false });
  function loadSave() { try { return Object.assign(fresh(), JSON.parse(localStorage.getItem('jipai-stall-v1')) || {}); } catch (e) { return fresh(); } }
  function writeSave() { try { localStorage.setItem('jipai-stall-v1', JSON.stringify(save)); } catch (e) {} }
  let save = loadSave();
  const has = id => !!save.ups[id];
  const goalOf = day => 250 + (day - 1) * 150;

  // ================= 點單資料 =================
  const CUSTOMERS = ['剛下班的上班族', '補習完的高中生', '巷口的阿伯', '帶小孩的媽媽', '趕單的外送員', '第一次來的觀光客', '隔壁攤的老闆', '熬夜的大學生', '剛打完球的國中生', '夜班護理師', '計程車司機', '約會中的情侶', '加班的工程師', '散步的阿嬤'];
  const THICK = [{ name: '薄脆', lo: 0.8, hi: 0.95 }, { name: '標準', lo: 1.05, hi: 1.2 }, { name: '厚切', lo: 1.4, hi: 1.55 }];
  const FRY = [{ name: '淺金', o: 0.85 }, { name: '金黃', o: 1.05 }, { name: '酥一點', o: 1.25 }];
  const POWDER = ['地瓜粉', '麵包粉'];
  const SALT = [{ name: '少鹽', lo: 3, hi: 4 }, { name: '正常', lo: 6, hi: 7 }, { name: '重鹹', lo: 9, hi: 10 }];
  const CHILI = [{ name: '不辣', lo: 0, hi: 0 }, { name: '小辣', lo: 1, hi: 2 }, { name: '中辣', lo: 3, hi: 4 }, { name: '大辣', lo: 6, hi: 8 }];
  const EXTRAS = [['plum', '梅粉'], ['seaweed', '海苔'], ['basil', '九層塔'], ['cheese', '起司']];
  const EVENTS = {
    none: { name: '平常的夜晚', desc: '照常營業。' },
    rush: { name: '演唱會散場', desc: '九點左右會湧進一大波客人，先備好料！' },
    typhoon: { name: '颱風夜', desc: '客人比較少，但大家都很有耐心。' },
    vip: { name: '網紅探店', desc: '今晚會有美食網紅來，他的單付三倍，但做不好口碑扣兩顆。' }
  };
  // 每天多開放一樣東西；還沒開放的不會出現在點單上
  const UNLOCK = { cut: 2, basil: 3, '麵包粉': 4, plum: 5, cheese: 6, seaweed: 7 };
  const UNLOCK_NAME = { cut: '切塊', basil: '九層塔', '麵包粉': '麵包粉', plum: '梅粉', cheese: '起司', seaweed: '海苔粉' };
  const dayNow = () => N ? N.day : save.day;
  const opened = k => !(k in UNLOCK) || dayNow() >= UNLOCK[k];
  const newToday = day => Object.keys(UNLOCK).filter(k => UNLOCK[k] === day).map(k => UNLOCK_NAME[k]);
  function makeOrder(vip) {
    const day = dayNow();
    // 厚度第 1 天就有三種；炸色第 1 天只有金黃，第 2 天加淺金，第 3 天起全開
    const span = (arr) => day <= 1 ? [arr[1]] : day === 2 ? arr.slice(0, 2) : arr;
    const o = {
      no: 0, who: vip ? '美食網紅 小雞排' : pick(CUSTOMERS), vip, rot: (rand() - 0.5) * 0.04, drop: 0,
      thick: pick(THICK), fry: pick(span(FRY)), powder: opened('麵包粉') ? pick(POWDER) : '地瓜粉',
      salt: pick(SALT), chili: pick(day <= 1 ? CHILI.slice(0, 3) : CHILI),
      plum: opened('plum') && rand() < 0.25, seaweed: opened('seaweed') && rand() < 0.25,
      basil: opened('basil') && rand() < 0.35, cheese: opened('cheese') && rand() < 0.3, cut: opened('cut') && rand() < 0.5
    };
    o.price = 70 + (o.cheese ? 15 : 0) + (o.thick.name === '厚切' ? 10 : 0);
    return o;
  }

  // ================= 一塊雞排 =================
  function newCutlet() {
    const n = 48, ph = [rand() * 6.28, rand() * 6.28, rand() * 6.28], pts = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      let d = a - Math.PI * 1.5; d = Math.atan2(Math.sin(d), Math.cos(d));
      const r = 1 + 0.12 * Math.cos(2 * a) - 0.14 * Math.exp(-(d * d) / 0.05)
        + 0.05 * Math.sin(3 * a + ph[0]) + 0.03 * Math.sin(5 * a + ph[1]) + 0.02 * Math.sin(7 * a + ph[2]);
      pts.push([Math.cos(a) * r * 1.05, Math.sin(a) * r * 0.74]);
    }
    const mask = mk(400), layer = mk(400 * RS);
    const lctx = layer.getContext('2d'); lctx.setTransform(RS, 0, 0, RS, 0, 0);
    const c = {
      pts, thick: 100, dThick: 100, holes: [], squash: 0, charge: null, swingT: -1e9,
      mask, mctx: mask.getContext('2d', { willReadFrequently: true }), layer, lctx,
      powder: null, coverage: 0, samples: null, gloss: [],
      outer: 0, inner: 0, salt: 0, chili: 0, plum: 0, seaweed: 0, basil: false, cheese: false, cut: false,
      leaves: [], cheeseLines: [], dots: [], falling: [],
      loc: { st: 'board' }, x: ICE.x + ICE.w / 2, y: ICE.y + 200, s: 0.35, dragging: false, dirty: true
    };
    for (let i = 0; i < 160; i++) c.gloss.push({ u: rand(), v: rand(), r: 0.8 + rand() * 1.8 });
    return c;
  }
  const spread = th => 1 + (100 - th) / 100 * 1.05;
  const cmOf = th => th * 0.03;
  function blobPath(c, sc) {
    const R = BASE_R * sc, p = new Path2D(), P = c.pts;
    const pt = i => { const q = P[(i + P.length) % P.length]; return [LX + q[0] * R, LY + q[1] * R]; };
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const m0 = mid(pt(-1), pt(0));
    p.moveTo(m0[0], m0[1]);
    for (let i = 0; i < P.length; i++) { const a = pt(i), m = mid(a, pt(i + 1)); p.quadraticCurveTo(a[0], a[1], m[0], m[1]); }
    p.closePath();
    return p;
  }
  const pathOf = c => blobPath(c, spread(c.thick));
  function randomInside(c) {
    const path = pathOf(c);
    for (let k = 0; k < 80; k++) {
      const x = LX + (rand() - 0.5) * 340, y = LY + (rand() - 0.5) * 260;
      if (hit.isPointInPath(path, x, y)) return [x, y];
    }
    return [LX, LY];
  }

  function renderCut(c) {
    const L = c.lctx, sc = spread(c.dThick), R = BASE_R * sc, path = blobPath(c, sc), o = c.outer;
    L.clearRect(0, 0, 400, 400);
    L.fillStyle = stopColor(MEAT, o); L.fill(path);
    if (o < 0.3) {
      L.save(); L.clip(path);
      L.strokeStyle = 'rgba(255,255,255,0.2)'; L.lineWidth = 2;
      for (let k = -7; k <= 7; k++) { L.beginPath(); L.moveTo(LX - R * 1.2, LY + k * 11 - 30); L.quadraticCurveTo(LX, LY + k * 11 + 12, LX + R * 1.2, LY + k * 11 - 18); L.stroke(); }
      L.restore();
    }
    if (c.powder) {
      tctx.globalCompositeOperation = 'source-over';
      tctx.clearRect(0, 0, tint.width, tint.height);
      tctx.fillStyle = stopColor(CRUST, o); tctx.fillRect(0, 0, tint.width, tint.height);
      tctx.globalCompositeOperation = 'overlay'; tctx.drawImage(TEX[c.powder], 0, 0);
      tctx.globalCompositeOperation = 'destination-in'; tctx.drawImage(c.mask, 0, 0, tint.width, tint.height);
      tctx.globalCompositeOperation = 'source-over';
      L.drawImage(tint, 0, 0, 400, 400);
    }
    L.save(); L.clip(path);
    const sh = L.createRadialGradient(LX - R * 0.4, LY - R * 0.45, 0, LX, LY, R * 1.5);
    sh.addColorStop(0, 'rgba(255,252,235,0.22)'); sh.addColorStop(0.5, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(60,25,0,0.38)');
    L.fillStyle = sh; L.fillRect(0, 0, 400, 400);
    L.strokeStyle = 'rgba(70,35,10,0.22)'; L.lineWidth = 10; L.stroke(path);
    if (o > 0.45) {
      const a = clamp((o - 0.45) / 0.5) * (o > 1.6 ? 0.4 : 1);
      L.fillStyle = `rgba(255,250,230,${0.55 * a})`;
      for (const s of c.gloss) { L.beginPath(); L.arc(LX + (s.u - 0.5) * R * 2, LY + (s.v - 0.5) * R * 1.5, s.r, 0, 6.29); L.fill(); }
    }
    L.restore();
    L.strokeStyle = stopColor(CRUST, Math.max(o, 0.2) + 0.25, -35, 0.9); L.lineWidth = 2; L.stroke(path);
    if (c.holes.length) {
      L.save(); L.globalCompositeOperation = 'destination-out';
      for (const h of c.holes) { L.beginPath(); L.ellipse(LX + h.u * R, LY + h.v * R, h.r * sc * 0.7, h.r * sc * 0.5, h.a, 0, 6.29); L.fill(); }
      L.restore();
    }
    if (c.dots.length || c.falling.length) {
      L.save(); L.clip(path);
      for (const d of c.dots) { L.fillStyle = d.c; L.fillRect(d.x, d.y, d.r * 1.6, d.r * 1.6); }
      for (const d of c.falling) { if (d.t < 0) continue; L.globalAlpha = d.t; L.fillStyle = d.c; L.fillRect(d.x, d.y - (1 - d.t) * 30, d.r * 1.6, d.r * 1.6); }
      L.globalAlpha = 1; L.restore();
    }
    if (c.cheese) {
      L.save(); L.clip(path); L.lineCap = 'round'; L.lineJoin = 'round';
      for (const pts of c.cheeseLines) {
        const line = (w, col, dy) => { L.strokeStyle = col; L.lineWidth = w; L.beginPath(); pts.forEach(([x, y], i) => i ? L.lineTo(x, y + dy) : L.moveTo(x, y + dy)); L.stroke(); };
        line(11, 'rgba(120,70,10,0.25)', 3); line(9, '#f0b324', 0); line(3.5, '#ffe08a', -2);
      }
      L.restore();
    }
    if (c.basil) for (const l of c.leaves) {

        ctx.fillStyle = '#e9edf0'; ctx.beginPath(); ctx.ellipse(0, 6, 30, 22, 0, 0, 6.29); ctx.fill(); noShadow();
        for (let k = 0; k < 7; k++) { ctx.save(); ctx.translate(-16 + k * 5.5, 2 + (k % 2) * 6); ctx.rotate(k * 0.9); ctx.fillStyle = k % 2 ? '#2f6a2c' : '#3f8a3a'; ctx.beginPath(); ctx.ellipse(0, 0, 9, 4.5, 0, 0, 6.29); ctx.fill(); ctx.restore(); }
      } else if (t.k === 'cheese') {
        ctx.fillStyle = '#f2c230'; ctx.beginPath(); ctx.roundRect(-16, -18, 32, 46, 10); ctx.fill(); noShadow();
        ctx.fillStyle = '#c4281c'; ctx.beginPath(); ctx.moveTo(-8, -18); ctx.lineTo(8, -18); ctx.lineTo(2, -34); ctx.lineTo(-2, -34); ctx.closePath(); ctx.fill();
        text('起司', 0, 6, '#7a4b00', 12, 900);
      } else {
        ctx.rotate(-0.5);
        ctx.fillStyle = '#5a3a20'; ctx.beginPath(); ctx.roundRect(-6, 4, 12, 30, 4); ctx.fill(); noShadow();
        const bl = ctx.createLinearGradient(-20, 0, 20, 0); bl.addColorStop(0, '#9aa3a9'); bl.addColorStop(0.5, '#f1f4f6'); bl.addColorStop(1, '#8a939a');
        ctx.fillStyle = bl; ctx.beginPath(); ctx.roundRect(-22, -36, 40, 42, 4); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(10, -26, 4, 0, 6.29); ctx.fill();
      }
      ctx.restore();
      if (locked) {
        ctx.fillStyle = '#5d666d'; ctx.beginPath(); ctx.roundRect(t.x - 9, t.y - 4, 18, 15, 3); ctx.fill();
        ctx.strokeStyle = '#5d666d'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(t.x, t.y - 4, 6, Math.PI, 0); ctx.stroke();
        text(`第 ${UNLOCK[t.k]} 天`, t.x, t.y + 44, '#7a7066', 12, 700);
        continue;
      }
      if (N && N.sel === t.k) {
        ctx.fillStyle = 'rgba(255,216,74,0.35)'; ctx.beginPath(); ctx.arc(t.x, t.y, 38, 0, 6.29); ctx.fill();
        ctx.strokeStyle = '#e0a400'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(t.x, t.y, 38, 0, 6.29); ctx.stroke();
      }
      if (on) { ctx.strokeStyle = '#2f8a4a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(t.x, t.y, 34, 0, 6.29); ctx.stroke(); }
      text(t.label, t.x, t.y + 44, '#2b2521', 12, 700);
      keyBadge(t.key, t.x + 22, t.y + 22);
    }
  }

  // ================= 繪圖：雞排與特效 =================
  function drawCut(c) {
    if (c.dirty || c.loc.st === 'wok' || Math.abs(c.dThick - c.thick) > 0.05 || c.falling.length) renderCut(c);
    const k = c.s * (1 + 0.035 * c.squash);
    ctx.save();
    ctx.translate(c.x, c.y); ctx.scale(k, k); ctx.translate(-LX, -LY);
    if (c.loc.st !== 'wok' || c.dragging) shadow(c.dragging ? 26 : 12, c.dragging ? 18 : 6, 0.38);
    ctx.drawImage(c.layer, 0, 0, 400, 400);
    ctx.restore();
    if (c.loc.st === 'wok' && !c.dragging) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s); ctx.translate(-LX, -LY);
      ctx.strokeStyle = 'rgba(214,138,38,0.5)'; ctx.lineWidth = 9; ctx.stroke(pathOf(c));
      ctx.restore();
      if (has('lamp')) {
        const o = c.outer, name = o < 0.7 ? '還白白的' : o < 0.95 ? '淺金' : o < 1.15 ? '金黃' : o < 1.4 ? '酥一點' : '焦了';
        tag(name, c.x, c.y + 78);
      }
    }
    if (c.loc.st === 'bowl' && !c.dragging) {
      const b = BOWLS[c.loc.i];
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(43,37,33,0.25)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 8, 0, 6.29); ctx.stroke();
      ctx.strokeStyle = c.coverage >= 0.9 ? '#2f8a4a' : '#e0a400';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * c.coverage); ctx.stroke();
    }
  }
  function drawGauge(c) {
    const th = c.charge ? c.charge.th : c.thick;
    const x0 = BOARD.x - 170, w = 340, y = BOARD.y + BOARD.r + 46, h = 14;
    const px = v => x0 + w * clamp((v - MIN_CM) / (3 - MIN_CM));
    ctx.save(); shadow(10, 4, 0.35);
    ctx.fillStyle = 'rgba(30,26,24,0.88)'; ctx.beginPath(); ctx.roundRect(x0 - 14, y - 30, w + 28, h + 52, 10); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(x0, y, w, h, 7); ctx.fill();
    for (const t of THICK) {
      const want = N.tickets.some(o => o.thick === t);
      ctx.fillStyle = want ? 'rgba(60,170,95,0.95)' : 'rgba(60,154,90,0.22)';
      ctx.fillRect(px(t.lo), y, px(t.hi) - px(t.lo), h);
      text(t.name, (px(t.lo) + px(t.hi)) / 2, y + h + 11, want ? '#9ee0b0' : 'rgba(255,255,255,0.45)', 11, 700);
    }
    ctx.fillStyle = '#ff4a35'; ctx.fillRect(px(cmOf(th)) - 2.5, y - 5, 5, h + 10);
    text(c.powder ? '已經裹粉了' : c.charge ? '放開就拍下去！' : '按住雞肉，看準時機放開', x0, y - 15, '#ffd84a', 14, 700, 'left');
    text(cmOf(th).toFixed(2) + ' 公分', x0 + w, y - 15, '#fff', 14, 700, 'right');
  }
  function drawMallet(c, now) {
    if (!c || c.powder || !mouse.inside || !inCircle(mouse.x, mouse.y, BOARD) || (ptr && ptr.mode === 'drag')) return;
    const since = now - c.swingT;
    const ang = c.charge ? 0.6 + 0.85 * c.charge.k : since < 60 ? lerp(1.2, 0, since / 60) : since < 260 ? lerp(0, 0.6, (since - 60) / 200) : 0.6;
    ctx.save(); ctx.translate(mouse.x + 75, mouse.y - 14); ctx.rotate(ang);
    shadow(10, 8, 0.3);
    const hw = ctx.createLinearGradient(0, -6, 0, 6); hw.addColorStop(0, '#a8743e'); hw.addColorStop(1, '#6e4520');
    ctx.fillStyle = hw; ctx.beginPath(); ctx.roundRect(-66, -6, 100, 12, 6); ctx.fill();
    const hd = ctx.createLinearGradient(-90, 0, -62, 0); hd.addColorStop(0, '#8e959b'); hd.addColorStop(0.4, '#e3e7ea'); hd.addColorStop(1, '#767d83');
    ctx.fillStyle = hd; ctx.beginPath(); ctx.roundRect(-90, -16, 30, 32, 4); ctx.fill();
    ctx.restore();
  }
  function drawShaker() {
    if (N.sel && !ptr && mouse.inside && inRect(mouse.x, mouse.y, TRAY) && at('tray') && !(shaker && shaker.t <= 0.45)) {
      const t = TOOLS.find(k => k.k === N.sel);
      ctx.save(); ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#fffdf5'; ctx.strokeStyle = '#e0a400'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(mouse.x + 14, mouse.y - 40, 70, 26, 13); ctx.fill(); ctx.stroke();
      text(t.label, mouse.x + 49, mouse.y - 26, '#2b2521', 14, 900);
      ctx.restore();
    }
    if (!shaker || shaker.t > 0.45) return;
    const s = SEASON[shaker.kind], wob = Math.sin(shaker.t * 45) * 0.18 * (1 - shaker.t / 0.45);
    ctx.save(); ctx.globalAlpha = clamp((0.45 - shaker.t) / 0.1);
    ctx.translate(shaker.x + 14, shaker.y - 56); ctx.rotate(2.55 + wob);
    const g = ctx.createLinearGradient(-18, 0, 18, 0);
    g.addColorStop(0, s.body); g.addColorStop(0.35, '#ffffff'); g.addColorStop(0.55, s.body); g.addColorStop(1, s.body);
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-18, -24, 36, 52, 7); ctx.fill();
    ctx.fillStyle = s.cap; ctx.beginPath(); ctx.roundRect(-19, -34, 38, 13, 4); ctx.fill();
    ctx.restore();
  }
  function drawParticles(dt) {
    for (const b of N.bits) {
      b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vx *= 0.92; b.vy *= 0.92;
      ctx.globalAlpha = clamp(1 - b.t / b.life); ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1; N.bits = N.bits.filter(b => b.t < b.life);
    for (const b of N.bubbles) {
      b.t += dt; const k = b.t / b.life;
      ctx.strokeStyle = `rgba(255,245,215,${0.85 * (1 - k)})`; ctx.fillStyle = `rgba(255,250,230,${0.22 * (1 - k)})`; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (1 + k), 0, 6.29); ctx.fill(); ctx.stroke();
    }
    N.bubbles = N.bubbles.filter(b => b.t < b.life);
    for (const s of N.steam) {
      s.t += dt;
      const k = s.t / s.life, x = s.x + Math.sin(s.t * 3 + s.r) * 8, y = s.y - s.t * 50, r = s.r * (1 + k * 1.6);
      const col = s.smoky ? '70,60,55' : '255,255,255', a = (s.smoky ? 0.4 : 0.16) * Math.sin(Math.PI * k);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill();
    }
    N.steam = N.steam.filter(s => s.t < s.life);
    for (const f of N.fx) {
      f.t += dt;
      if (f.type === 'ring') {
        ctx.strokeStyle = `rgba(255,255,255,${clamp(1 - f.t * 3)})`; ctx.lineWidth = 3;
        const r = 10 + f.t * 110 * f.k; ctx.beginPath(); ctx.ellipse(f.x, f.y, r, r * 0.7, 0, 0, 6.29); ctx.stroke();
      } else {
        const k = f.t / f.life; ctx.globalAlpha = clamp(1 - k);
        const size = f.size * (k < 0.15 ? lerp(1.4, 1, k / 0.15) : 1);
        ctx.font = font(900, size); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = 7; ctx.strokeStyle = '#2b2521'; ctx.strokeText(f.s, f.x, f.y - f.t * 34);
        ctx.fillStyle = f.color; ctx.fillText(f.s, f.x, f.y - f.t * 34); ctx.globalAlpha = 1;
      }
    }
    N.fx = N.fx.filter(f => f.t < (f.type === 'ring' ? 0.4 : f.life));
  }
  function drawHint() {
    if (!N.running || !N.hint) return;
    ctx.font = font(700, 20, HAND);
    const w = ctx.measureText(N.hint).width + 36, x = 620, y = 872;
    ctx.fillStyle = 'rgba(30,26,24,0.82)'; ctx.beginPath(); ctx.roundRect(x - w / 2, y - 18, w, 36, 18); ctx.fill();
    text(N.hint, x, y + 1, '#fff6dc', 20, 700, 'center', HAND);
  }

  // ================= 主迴圈 =================
  let last = performance.now(), hintT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const live = N.running && !N.paused;
    if (live) {
      N.t += dt;
      // 客人上門
      // 點單都清空了，下一位客人很快就來：動作越快，一晚接的客人越多
      if (!N.tickets.length && N.spawnT > 4) N.spawnT = 4;
      N.spawnT -= dt;
      const phase = N.t / NIGHT, rush = N.ev === 'rush' && phase > 0.55 && phase < 0.75;
      if (N.spawnT <= 0 && N.tickets.length < N.maxT && N.t < NIGHT - 12) {
        const vip = N.ev === 'vip' && !N.vipDone && phase > 0.35;
        if (vip) N.vipDone = true;
        addTicket(vip);
        N.spawnT = N.interval * (0.7 + 0.6 * rand()) * (rush ? 0.35 : 1);
      }
      for (let i = N.tickets.length - 1; i >= 0; i--) {
        const o = N.tickets[i];
        o.p -= dt / o.total;
        if (o.p <= 0) {
          N.tickets.splice(i, 1); N.left++; N.hearts -= o.vip ? 2 : 1; buzz();
          toast(`<b>${o.who}</b>等不及走掉了⋯⋯口碑 -${o.vip ? 2 : 1}`, true);
        }
      }
      // 油溫：大火回到 180°C、小火降到 150°C；丟肉下去會降溫
      const target = N.low ? 150 : 180;
      N.temp += clamp(target - N.temp, -dt * 6, dt * 2.5);
      let frying = 0;
      for (const c of N.cuts) {
        if (c.loc.st === 'wok' && !c.dragging) {
          frying++;
          c.outer += dt * heat() / 6;
          c.inner += dt * (0.7 + 0.3 * heat()) / innerIdeal(c);
          const p = posOf(c.loc), R = BASE_R * spread(c.thick) * p.s;
          const rate = (90 * (1 - 0.75 * clamp(c.inner)) + 10) * heat();
          let n = rate * dt;
          while (n > 0) { if (rand() < n) { const q = pick(c.pts), out = 1 + rand() * 0.15; N.bubbles.push({ x: p.x + q[0] * R * out, y: p.y + q[1] * R * out, r: 1.4 + rand() * 3, t: 0, life: 0.3 + rand() * 0.4 }); } n -= 1; }
          if (rand() < (2 + 5 * clamp(c.outer, 0, 1.5)) * dt) N.steam.push({ x: p.x + (rand() - 0.5) * R, y: p.y + (rand() - 0.5) * R * 0.6, t: 0, life: 1.4 + rand() * 0.8, r: 10 + rand() * 10, smoky: c.outer > 1.5 });
        }
        if (c.charge) swing(c, now);
        c.squash = Math.max(0, c.squash - dt * 6);
        c.dThick += (c.thick - c.dThick) * clamp(dt * 14);
        if (c.falling.length) {
          for (const d of c.falling) d.t += dt * 3.2;
          c.dots.push(...c.falling.filter(d => d.t >= 1)); c.falling = c.falling.filter(d => d.t < 1);
        }
      }
      setSizzle(frying ? 0.05 + 0.07 * frying : 0);
      if (shaker) shaker.t += dt;
      hintT -= dt; if (hintT <= 0) { updateHint(); hintT = 0.3; }
    }
    for (const c of N.cuts) {
      if (c.dragging) continue;
      const p = posOf(c.loc), k = clamp(dt * 12);
      c.x = lerp(c.x, p.x, k); c.y = lerp(c.y, p.y, k); c.s = lerp(c.s, p.s, k);
    }

    drawScene(now);
    const rank = { board: 0, bowl: 1, wok: 2, tray: 3 };
    [...N.cuts].sort((a, b) => (a.dragging - b.dragging) || (rank[a.loc.st] - rank[b.loc.st])).forEach(drawCut);
    const bc = at('board');
    if (bc) drawGauge(bc);
    drawShaker();
    drawParticles(live ? dt : 0);
    drawMallet(bc, now);
    drawHint();
    // 四周暗角，讓畫面像夜市燈光
    const v = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.45, W / 2, H * 0.55, H * 1.05);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

    if (live && N.t >= NIGHT) endNight(false);
    else if (live && N.hearts <= 0) endNight(true);
    requestAnimationFrame(frame);
  }

  showStart();
  requestAnimationFrame(frame);
})();
</script>
